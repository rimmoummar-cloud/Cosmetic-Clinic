name: Process Booking Reminders

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  process-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reminder processor
        run: |
          curl --fail-with-body \
            -X GET \
            "${{ secrets.RENDER_BACKEND_URL }}/api/cron/process-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"